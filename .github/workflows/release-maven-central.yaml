name: Release to Maven Central

on:
  release:
    types: [created]
  workflow_dispatch:

concurrency:
  group: maven-central-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Verify snapshot version
        if: github.event_name == 'workflow_dispatch'
        run: |
          version="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          if [[ "$version" != *-SNAPSHOT ]]; then
            echo "Manual publishing requires a -SNAPSHOT version, got: $version"
            exit 1
          fi

      - name: Verify release version
        if: github.event_name == 'release'
        run: |
          version="$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)"
          if [[ "$version" == *-SNAPSHOT ]]; then
            echo "Release publishing requires a non-SNAPSHOT version, got: $version"
            exit 1
          fi

      - name: Publish to Maven Central
        run: mvn clean deploy --batch-mode -DskipTests -P release -U -e
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.MAVEN_CENTRAL_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
